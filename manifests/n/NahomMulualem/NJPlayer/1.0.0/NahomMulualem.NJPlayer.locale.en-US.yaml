ShortDescription: Free, fast, dark electric cyan Windows video and audio player inspired by PotPlayer.
Description: |
  NJ Player is a high-performance Windows media player powered by libmpv and C# WPF.
  Features include instant seeking, hardware-accelerated video decoding, frameless dark UI,
  10-band equalizer, Ge'ez/Amharic subtitle support, lossless stream-copy trimmer,
  community radio browser with Ethiopia station discovery, and real-time audio visualizers.
